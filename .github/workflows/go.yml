name: Go

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v6
    - name: 'Set up Go'
      uses: actions/setup-go@v6
      with:
        go-version-file: 'kms/go.mod'
    - name: Build
      run: |
         go build ./kms ./kes
         go vet ./kms ./kes
    - name: Lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.11.3
        args: --config ./.golangci.yml --timeout=5m ./kms ./kes
  test:
    name: Test ${{ matrix.os }}
    needs: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Check out code
      uses: actions/checkout@v6
    - name: 'Set up Go'
      uses: actions/setup-go@v6
      with:
        go-version-file: 'kms/go.mod'
    - name: Test
      run: | 
        go test ./kms ./kes
  
  vulncheck:
    name: Vulncheck
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'kms/go.mod'
    - name: Get govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest
      shell: bash
    - name: Run govulncheck
      env:
        GODEBUG: toolchaintrace=1
      run: |
        govulncheck -C ./kms ./...
        govulncheck -C ./kes ./...
      shell: bash
